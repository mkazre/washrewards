  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:clamp(32px,5vw,56px); align-items:center;\">\n      <div>\n        <span style=\"font-weight:700; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:#0E9AA6;\">Where we're launching<\u002Fspan>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(30px,4.4vw,48px); line-height:1.06; letter-spacing:-.02em; margin:12px 0 0;\">Johannesburg first, Gauteng next<\u002Fh2>\n        <p style=\"color:#52677A; font-size:17px; line-height:1.6; margin:16px 0 24px;\">We're starting where the cars are. Gauteng holds the largest share of South Africa's vehicles, so that's where WashRewards begins.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n          <span style=\"background:#0A1E37; color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px;\">Sandton<\u002Fspan>\n          <span style=\"background:#0A1E37; color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px;\">Rosebank<\u002Fspan>\n          <span style=\"background:#0A1E37; color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px;\">Midrand<\u002Fspan>\n          <span style=\"background:#0A1E37; color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px;\">Fourways<\u002Fspan>\n          <span style=\"background:#0A1E37; color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px;\">Randburg<\u002Fspan>\n          <span style=\"background:#0A1E37; color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px;\">Roodepoort<\u002Fspan>\n          <span style=\"background:#0A1E37; color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px;\">Soweto<\u002Fspan>\n          <span style=\"background:#0A1E37; color:#fff; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px;\">Bedfordview<\u002Fspan>\n          <span style=\"background:rgba(21,201,212,.14); color:#0E9AA6; font-weight:700; font-size:13.5px; padding:9px 16px; border-radius:999px; border:1px dashed #15C9D4;\">Pretoria · Cape Town soon<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; border-radius:24px; overflow:hidden; border:1px solid #E2EEF0; aspect-ratio:4/3; background:#0A1E37; box-shadow:0 18px 40px rgba(10,30,55,.18); display:flex; align-items:center; justify-content:center;\">\n        <img src=\"78a0d9a0-2a01-401d-9a62-a7747f1f010a\" alt=\"WashRewards SA coverage — Johannesburg, South Africa\" style=\"height:100%; max-width:100%; object-fit:contain; display:block;\">\n        <span style=\"position:absolute; left:16px; top:16px; display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff; font-weight:700; font-size:12.5px; padding:7px 13px; border-radius:999px; backdrop-filter:blur(4px);\"><span style=\"width:8px; height:8px; border-radius:50%; background:#15C9D4;\"><\u002Fspan>Now serving<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== REGISTER FORM ===================== -->\n  <section id=\"register\" data-screen-label=\"Register interest\" style=\"scroll-margin-top:88px; padding:clamp(64px,9vw,116px) clamp(20px,5vw,64px); background:linear-gradient(165deg,#0A1E37,#0E3A55);\">\n    <div style=\"max-width:600px; margin:0 auto;\">\n      <div style=\"text-align:center; margin-bottom:34px;\">\n        <h2 style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(30px,4.4vw,46px); line-height:1.06; letter-spacing:-.02em; color:#fff; margin:0;\">Be first in line<\u002Fh2>\n        <p style=\"color:rgba(255,255,255,.7); font-size:17px; line-height:1.6; margin:14px 0 0;\">Join the launch list as a customer, or apply to bring your car wash on board. We'll be in touch.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:clamp(24px,4vw,38px);\">\n        <div style=\"display:flex; gap:6px; background:rgba(255,255,255,.06); padding:6px; border-radius:999px; margin-bottom:26px;\">\n          <button onclick=\"{{ setCustomer }}\" type=\"button\" style=\"{{ customerBtnStyle }}\">I'm a customer<\u002Fbutton>\n          <button onclick=\"{{ setPartner }}\" type=\"button\" style=\"{{ partnerBtnStyle }}\">I run a car wash<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <form onsubmit=\"{{ onSubmit }}\">\n          <sc-if value=\"{{ isPartner }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:block; color:rgba(255,255,255,.75); font-size:13px; font-weight:600; margin-bottom:7px;\">Car wash / business name<\u002Flabel>\n            <input type=\"text\" name=\"business_name\" required=\"\" placeholder=\"e.g. AquaShine Sandton\" style=\"width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); border-radius:12px; padding:14px 16px; color:#fff; font-family:inherit; font-size:15px; margin-bottom:16px;\">\n          <\u002Fsc-if>\n          <label style=\"display:block; color:rgba(255,255,255,.75); font-size:13px; font-weight:600; margin-bottom:7px;\">Full name<\u002Flabel>\n          <input type=\"text\" name=\"full_name\" required=\"\" placeholder=\"Your name\" style=\"width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); border-radius:12px; padding:14px 16px; color:#fff; font-family:inherit; font-size:15px; margin-bottom:16px;\">\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:16px;\">\n            <div>\n              <label style=\"display:block; color:rgba(255,255,255,.75); font-size:13px; font-weight:600; margin-bottom:7px;\">Email<\u002Flabel>\n              <input type=\"email\" name=\"email\" required=\"\" placeholder=\"you@email.com\" style=\"width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); border-radius:12px; padding:14px 16px; color:#fff; font-family:inherit; font-size:15px;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block; color:rgba(255,255,255,.75); font-size:13px; font-weight:600; margin-bottom:7px;\">Phone<\u002Flabel>\n              <input type=\"tel\" name=\"phone\" placeholder=\"071 234 5678\" style=\"width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); border-radius:12px; padding:14px 16px; color:#fff; font-family:inherit; font-size:15px;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:block; color:rgba(255,255,255,.75); font-size:13px; font-weight:600; margin-bottom:7px;\">Area / suburb<\u002Flabel>\n          <input type=\"text\" name=\"area\" placeholder=\"e.g. Fourways, Johannesburg\" style=\"width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); border-radius:12px; padding:14px 16px; color:#fff; font-family:inherit; font-size:15px; margin-bottom:24px;\">\n          <button type=\"submit\" style=\"width:100%; background:#15C9D4; color:#06283D; border:none; font-family:inherit; font-weight:700; font-size:16px; padding:16px; border-radius:999px; cursor:pointer; box-shadow:0 12px 30px rgba(21,201,212,.32);\" style-hover=\"background:#1BE0E0;\">{{ submitLabel }}<\u002Fbutton>\n        <\u002Fform>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center; padding:24px 8px; animation:wrRise .4s ease;\">\n            <span style=\"width:64px; height:64px; border-radius:50%; background:rgba(21,201,212,.18); border:2px solid #15C9D4; display:inline-flex; align-items:center; justify-content:center; font-size:30px;\">✓<\u002Fspan>\n            <h3 style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; color:#fff; margin:18px 0 8px;\">You're on the list!<\u002Fh3>\n            <p style=\"color:rgba(255,255,255,.7); font-size:15px; line-height:1.55; margin:0 0 22px;\">Thanks for registering your interest. We'll reach out at the email you provided as we get closer to launch.<\u002Fp>\n            <button onclick=\"{{ submitAnother }}\" type=\"button\" style=\"background:transparent; color:#15C9D4; border:1.5px solid rgba(21,201,212,.5); font-family:inherit; font-weight:700; font-size:15px; padding:12px 24px; border-radius:999px; cursor:pointer;\">Submit another<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer style=\"background:#061626; padding:clamp(48px,6vw,72px) clamp(20px,5vw,64px) 40px;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:36px; align-items:start;\">\n        <div>\n          <a href=\"#top\" style=\"display:flex; align-items:center; gap:11px; text-decoration:none; margin-bottom:14px;\">\n            <span style=\"width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(150deg,#1BE0E0,#0E9AA6); border-radius:50% 50% 50% 4px; transform:rotate(-2deg);\"><span style=\"width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.85);\"><\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:#fff;\">WashRewards<span style=\"color:#15C9D4;\"> SA<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n          <p style=\"color:rgba(255,255,255,.5); font-size:14px; line-height:1.6; max-width:300px; margin:0;\">Wash more. Earn more. Save more. The digital car wash booking, payment &amp; loyalty platform for Johannesburg and Gauteng.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; margin-bottom:14px;\">Explore<\u002Fdiv>\n          <div style=\"display:grid; gap:10px;\">\n            <a href=\"#how\" style=\"color:rgba(255,255,255,.6); text-decoration:none; font-size:14px;\">How it works<\u002Fa>\n            <a href=\"#rewards\" style=\"color:rgba(255,255,255,.6); text-decoration:none; font-size:14px;\">Rewards<\u002Fa>\n            <a href=\"#partners\" style=\"color:rgba(255,255,255,.6); text-decoration:none; font-size:14px;\">For partners<\u002Fa>\n            <a href=\"#coverage\" style=\"color:rgba(255,255,255,.6); text-decoration:none; font-size:14px;\">Coverage<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; margin-bottom:14px;\">Get in touch<\u002Fdiv>\n          <div style=\"display:grid; gap:10px;\">\n            <a href=\"mailto:info@washrewards.online\" style=\"color:#15C9D4; text-decoration:none; font-size:14px; font-weight:600;\">info@washrewards.online<\u002Fa>\n            <span style=\"color:rgba(255,255,255,.6); font-size:14px;\">Johannesburg, South Africa<\u002Fspan>\n            <a href=\"#register\" style=\"color:rgba(255,255,255,.6); text-decoration:none; font-size:14px;\">Join the waitlist →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.08); margin-top:40px; padding-top:24px; display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between;\">\n        <span style=\"color:rgba(255,255,255,.4); font-size:13px;\">© 2026 WashRewards SA. All rights reserved.<\u002Fspan>\n        <span style=\"color:rgba(255,255,255,.32); font-size:13px;\">POPIA-aware · Secure card payments · Working brand name<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPremium&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showTiers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { isNarrow: false, menuOpen: false, count: 5, mode: 'customer', submitted: false };\n\n  componentDidMount() {\n    this.mq = window.matchMedia('(max-width: 880px)');\n    this._apply = () => this.setState({ isNarrow: this.mq.matches, menuOpen: false });\n    this._apply();\n    if (this.mq.addEventListener) this.mq.addEventListener('change', this._apply);\n    else this.mq.addListener(this._apply);\n  }\n\n  componentWillUnmount() {\n    if (!this.mq) return;\n    if (this.mq.removeEventListener) this.mq.removeEventListener('change', this._apply);\n    else this.mq.removeListener(this._apply);\n  }\n\n  renderVals() {\n    const { isNarrow, menuOpen, count, mode, submitted } = this.state;\n    const showPremium = this.props.showPremium ?? true;\n    const showTiers = this.props.showTiers ?? true;\n\n    const menuStyle = isNarrow\n      ? `position:absolute; top:100%; left:0; right:0; display:${menuOpen ? 'flex' : 'none'}; flex-direction:column; align-items:stretch; gap:18px; background:#0A1E37; padding:22px clamp(20px,5vw,64px) 28px; border-top:1px solid rgba(255,255,255,.08); box-shadow:0 22px 44px rgba(0,0,0,.35);`\n      : `display:flex; flex-direction:row; align-items:center; gap:30px;`;\n    const hamburgerDisplay = isNarrow ? 'inline-flex' : 'none';\n\n    const stamps = [1, 2, 3, 4, 5, 6].map((n) => {\n      const filled = n <= count;\n      const isVoucher = n === 6;\n      const border = filled ? (isVoucher ? '#FFC53D' : '#15C9D4') : 'rgba(255,255,255,.18)';\n      const bg = filled ? (isVoucher ? 'rgba(255,197,61,.16)' : 'rgba(21,201,212,.16)') : 'transparent';\n      const color = filled ? (isVoucher ? '#FFC53D' : '#7FE9F0') : 'rgba(255,255,255,.4)';\n      return {\n        n,\n        label: isVoucher ? 'R100' : String(n),\n        style: `width:clamp(40px,9.5vw,56px); height:clamp(40px,9.5vw,56px); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:${isVoucher ? '11px' : '17px'}; flex:0 0 auto; border:2px solid ${border}; background:${bg}; color:${color}; transition:all .25s ease;`,\n      };\n    });\n\n    const isPartner = mode === 'partner';\n    const baseToggle = `flex:1; text-align:center; padding:12px 8px; border-radius:999px; font-weight:700; font-size:15px; cursor:pointer; border:none; transition:all .2s ease; font-family:inherit;`;\n    const customerBtnStyle = `${baseToggle} background:${!isPartner ? '#15C9D4' : 'transparent'}; color:${!isPartner ? '#06283D' : 'rgba(255,255,255,.6)'};`;\n    const partnerBtnStyle = `${baseToggle} background:${isPartner ? '#15C9D4' : 'transparent'}; color:${isPartner ? '#06283D' : 'rgba(255,255,255,.6)'};`;\n\n    return {\n      menuStyle,\n      hamburgerDisplay,\n      showPremium,\n      showTiers,\n      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      count,\n      stamps,\n      voucherReady: count >= 6,\n      addWash: () => this.setState((s) => ({ count: Math.min(s.count + 1, 6) })),\n      resetWash: () => this.setState({ count: 0 }),\n      isPartner,\n      customerBtnStyle,\n      partnerBtnStyle,\n      setCustomer: () => this.setState({ mode: 'customer' }),\n      setPartner: () => this.setState({ mode: 'partner' }),\n      submitLabel: isPartner ? 'Apply to partner' : 'Join the waitlist',\n      submitted,\n      notSubmitted: !submitted,\n      onSubmit: (e) => { e.preventDefault(); var fd = new FormData(e.target); fd.append('mode', mode); fetch('contact.php', { method: 'POST', body: fd }).then(function(r){ return r.json(); }).then(function(j){ if (j.success) { this.setState({ submitted: true }); } else { alert('Something went wrong. Please email info@washrewards.online directly.'); } }.bind(this)).catch(function(){ alert('Something went wrong. Please email info@washrewards.online directly.'); }); },\n      submitAnother: () => this.setState({ submitted: false }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
